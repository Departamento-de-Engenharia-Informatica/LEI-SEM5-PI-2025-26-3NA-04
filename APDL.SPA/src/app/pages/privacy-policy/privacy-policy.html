<div class="privacy-policy-container">
  <header class="policy-header">
    <h1>Privacy Policy</h1>
  </header>

  <div *ngIf="loading" class="loading-spinner">
    <div class="spinner"></div>
    <p>Loading privacy policy...</p>
  </div>

  <div *ngIf="error" class="alert alert-error">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error && policy" class="policy-content">
    <div class="version-info">
      <p><strong>Version:</strong> {{ policy.version }}</p>
      <p><strong>Effective Date:</strong> {{ policy.effectiveDate | date:'medium' }}</p>
    </div>

    <div class="policy-text" [innerHTML]="policy.content"></div>

    <div class="policy-actions" *ngIf="!isAuthenticated">
      <button class="btn-primary" (click)="goToLogin()">
        Back to Login
      </button>
    </div>
  </div>
</div>
